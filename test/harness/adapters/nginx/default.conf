# NGINX gating via auth_request against the standalone Authorizer.
# Mirrors adapters/nginx/jitaccess.conf, adapted for the lab (plain HTTP).

server {
    listen 80;
    server_name app.example.com;

    # 1. Protocol endpoints -> the Authorizer, on the protected origin's own
    #    hostname. These MUST stay reachable while the service is dark.
    location /.well-known/jit-access/ {
        proxy_pass         http://authorizer:8998;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;   # assign, never append
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
    }

    # 2. The gate.
    location = /jit-authz {
        internal;
        proxy_pass              http://authorizer:8998/authz;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length     "";
        proxy_set_header        X-Forwarded-For    $remote_addr;
        proxy_set_header        X-Forwarded-Host   $host;
        proxy_set_header        X-Forwarded-Proto  $scheme;
        proxy_set_header        X-Forwarded-Uri    $request_uri;
        proxy_set_header        X-Forwarded-Method $request_method;
        # Blank the OTHER forwarding conventions. The Authorizer refuses a request
        # where two conventions disagree, so a client appending X-Original-URL would
        # otherwise turn its own request into a denial (and, before that rule, could
        # steer which service was evaluated). Assigning "" removes the header.
        proxy_set_header        X-Original-URL     "";
        proxy_set_header        X-Original-Host    "";
        proxy_set_header        X-Original-Uri     "";
        proxy_set_header        Cookie             $http_cookie;
    }

    # 3. Everything else is gated, and denials render the Authorizer's own
    #    response so the extension sees the X-JIT-Access marker.
    location / {
        auth_request /jit-authz;
        auth_request_set $jit_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $jit_cookie always;

        # auth_request maps: 2xx -> allow, 401/403 -> deny with that status,
        # ANYTHING ELSE -> 500. A stealth-mode Authorizer answers 404, which
        # surfaces here as 500, so 500 is mapped too — otherwise stealth
        # deployments serve an error page instead of the intended generic 404.
        error_page 401 403 500 = @jit_denied;

        proxy_pass http://upstream:8080;
        proxy_set_header Host $host;
    }

    location @jit_denied {
        internal;
        # nginx forbids a URI part on proxy_pass inside a NAMED location, so the
        # path is set with `rewrite ... break` instead.
        rewrite ^ /authz break;
        proxy_pass              http://authorizer:8998;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length    "";
        proxy_set_header        X-Forwarded-For   $remote_addr;
        proxy_set_header        X-Forwarded-Host  $host;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Forwarded-Uri   $request_uri;
        # Same blanking as the gate location: without it a client-supplied
        # X-Original-URL reaches /authz here too, conflicts with the assigned
        # X-Forwarded-*, and the resulting deny falls back to the INTERSTITIAL —
        # announcing a gate the operator configured as stealth.
        proxy_set_header        X-Original-URL    "";
        proxy_set_header        X-Original-Host   "";
        proxy_set_header        X-Original-Uri    "";
        proxy_set_header        Cookie            $http_cookie;
    }
}
