# OpenResty gating via the core/lua shim in access_by_lua.
# In-process: no sidecar, and it reads the real TCP peer.

worker_processes 1;
error_log /dev/stderr notice;

events { worker_connections 1024; }

http {
    # the portable core + the openresty adapter shim (baked in by the Dockerfile)
    lua_package_path "/usr/local/share/jitaccess/?.lua;/usr/local/share/jitaccess/lib/?.lua;;";

    # Simple profile keeps ALL state here. jit_nonces is dedicated to spent-nonce
    # claims and rate-limit counters so a nonce flood cannot evict live grants.
    lua_shared_dict jit_grants 16m;
    lua_shared_dict jit_nonces 16m;

    resolver 127.0.0.11 ipv6=off;   # docker's embedded DNS

    init_by_lua_block {
        require("jitaccess.openresty").init({
            uri_prefix  = "/.well-known/jit-access",
            grant_ttl   = 3600,
            nonce_ttl   = 60,
            ipv6_prefix = 128,
            rate_limit  = 100,          -- generous: the conformance suite knocks a lot
            trust_forwarded = false,    -- key on the un-forgeable TCP peer

            tokens = {
                { kid = "kid_lab", secret = "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE", label = "lab device" },
            },
            services = {
                ["app.example.com"] = {
                    tokens       = { "kid_lab" },
                    binding      = "ip",
                    failure_mode = "interstitial",
                },
            },
        })
    }

    server {
        listen 80;
        server_name app.example.com;

        # One line gates the whole server. The knock endpoints are answered by
        # the access phase itself, so they need no location block.
        access_by_lua_block { require("jitaccess.openresty").access() }

        location / {
            proxy_pass http://upstream:8080;
            proxy_set_header Host $host;
        }
    }
}
