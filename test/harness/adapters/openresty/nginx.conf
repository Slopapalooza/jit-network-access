# OpenResty gating via the core/lua shim in access_by_lua.
# In-process: no sidecar, and it reads the real TCP peer.

worker_processes 1;
error_log /dev/stderr notice;

events { worker_connections 1024; }

http {
    # the portable core + the openresty adapter shim (baked in by the Dockerfile)
    lua_package_path "/usr/local/share/jitaccess/?.lua;/usr/local/share/jitaccess/lib/?.lua;;";

    # Simple profile keeps ALL state here. jit_nonces is dedicated to spent-nonce
    # claims and rate-limit counters so a nonce flood cannot evict live grants.
    lua_shared_dict jit_grants 16m;
    lua_shared_dict jit_nonces 16m;
    lua_shared_dict jit_rl 4m;

    resolver 127.0.0.11 ipv6=off;   # docker's embedded DNS

    init_by_lua_block {
        require("jitaccess.openresty").init({
            uri_prefix  = "/.well-known/jit-access",
            grant_ttl   = 3600,
            nonce_ttl   = 60,
            ipv6_prefix = 128,
            rate_limit  = 100,          -- generous: the conformance suite knocks a lot
            trust_forwarded = false,    -- key on the un-forgeable TCP peer

            tokens = {
                { kid = "kid_lab", secret = "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE", label = "lab device" },
            },
            services = {
                ["app.example.com"] = {
                    tokens       = { "kid_lab" },
                    binding      = "ip",
                    failure_mode = "interstitial",
                },
                -- Same gate, stealth failure mode. This engine had NO stealth
                -- coverage of any kind before: no unit test, and the lab pinned
                -- interstitial everywhere.
                ["stealth.example.com"] = {
                    tokens       = { "kid_lab" },
                    binding      = "ip",
                    failure_mode = "stealth",
                },
            },
        })
    }

    # ONE gated host per server block. Listing both here —
    #     server_name app.example.com stealth.example.com;
    # — is what the lab did first, and it silently broke stealth: $server_name is
    # the FIRST name in the directive, not the name nginx matched, so every
    # request resolved to app.example.com and the stealth service answered with
    # the interstitial and its X-JIT-Access marker. It also meant both hosts
    # shared one service identity, so a grant for one would open the other. The
    # adapter now refuses that shape rather than guessing; this is the shape a
    # real deployment should use.
    server {
        listen 80;
        server_name app.example.com;

        # One line gates the whole server. The knock endpoints are answered by
        # the access phase itself, so they need no location block.
        access_by_lua_block { require("jitaccess.openresty").access() }

        location / {
            proxy_pass http://upstream:8080;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 80;
        server_name stealth.example.com;

        access_by_lua_block { require("jitaccess.openresty").access() }

        location / {
            proxy_pass http://upstream:8080;
            proxy_set_header Host $host;
        }
    }
}
