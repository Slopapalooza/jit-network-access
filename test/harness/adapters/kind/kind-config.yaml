# Single-node kind cluster with ingress-nginx ready and port 80 published on
# the host as 8085, so the lab's knock client can reach it like any other engine.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: jit-lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8085
        protocol: TCP
