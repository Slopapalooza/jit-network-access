# JIT Network Access — multi-engine adapter lab.
#
# Brings up the same protected service behind four different engines, each
# gating it with the SAME device token. That is the portability claim made
# executable: one enrolled token, one knock client, four gates.
#
#   engine                      port   how it gates
#   --------------------------- ------ ---------------------------------------
#   Caddy (native module)       8081   in-process, jit_access handler
#   NGINX + Authorizer          8082   auth_request -> jitaccess-authorizer
#   Traefik (native plugin)     8083   in-process, Yaegi-interpreted middleware
#   OpenResty (core/lua shim)   8084   in-process, access_by_lua
#
# Kubernetes/ingress-nginx is a separate stack (see ../kind/), because it needs
# its own cluster.
#
#   docker compose up -d --build
#   ./run.sh                     # knock each engine with the same token
#
# Build context is the REPO ROOT for the Go images, so they can reach core/go.

name: jit-adapters

x-token: &token "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE" # b64u(0x01 * 32)

services:
  # The thing being protected. Reaching it means a gate opened.
  upstream:
    image: traefik/whoami
    command: ["--port=8080", "--name=protected-upstream"]
    networks: [jit]

  # ---- 1. Caddy: native module, no sidecar -------------------------------
  caddy:
    build:
      context: ../../..
      dockerfile: test/harness/adapters/caddy.Dockerfile
    ports: ["8081:80"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [jit]
    depends_on: [upstream]

  # ---- 2. NGINX + the standalone Authorizer ------------------------------
  # The Authorizer is deliberately NOT published: /authz and /admin must not be
  # reachable from outside, and it refuses peers outside trusted_proxies anyway.
  authorizer:
    build:
      context: ../../..
      dockerfile: authorizer/Dockerfile
    volumes:
      - ./authorizer/config.json:/etc/jitaccess/config.json:ro
    networks: [jit]

  nginx:
    image: nginx:1.27-alpine
    ports: ["8082:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [jit]
    depends_on: [authorizer, upstream]

  # ---- 3. Traefik: native plugin, interpreted by Yaegi -------------------
  traefik:
    image: traefik:v3.3
    ports: ["8083:80"]
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      # Traefik loads local plugins from this exact GOPATH-style layout
      - ../../../adapters/traefik/plugin:/plugins-local/src/github.com/Slopapalooza/jit-network-access/adapters/traefik/plugin:ro
    networks: [jit]
    depends_on: [upstream]

  # ---- 4. OpenResty: the core/lua shim in access_by_lua ------------------
  openresty:
    build:
      context: ../../..
      dockerfile: test/harness/adapters/openresty.Dockerfile
    ports: ["8084:80"]
    volumes:
      - ./openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    networks: [jit]
    depends_on: [upstream]

networks:
  jit:
    driver: bridge
