# JIT Network Access for plain NGINX, via the standalone Authorizer.
# Include this inside the server { } block you want to gate.
#
#   include /etc/nginx/snippets/jitaccess.conf;
#
# Assumes the Authorizer listens on 127.0.0.1:8998.

# ---- 1. the protocol endpoints -------------------------------------------
# challenge / respond / enroll are served BY the Authorizer, on the protected
# origin's own hostname, and must stay reachable while the service is dark.
location /.well-known/jit-access/ {
    proxy_pass         http://127.0.0.1:8998;
    proxy_set_header   Host              $host;
    # assign (never append) so a client-supplied value cannot survive
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   Cookie            $http_cookie;   # ip+cookie binding
    proxy_pass_request_body on;
}

# ---- 2. the gate ----------------------------------------------------------
location = /jit-authz {
    internal;
    proxy_pass              http://127.0.0.1:8998/authz;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";

    proxy_set_header        X-Forwarded-For    $remote_addr;
    proxy_set_header        X-Forwarded-Host   $host;
    proxy_set_header        X-Forwarded-Proto  $scheme;
    proxy_set_header        X-Forwarded-Uri    $request_uri;
    proxy_set_header        X-Forwarded-Method $request_method;
    proxy_set_header        Cookie             $http_cookie;
}

# ---- 3. apply it to the site ---------------------------------------------
# Put `auth_request /jit-authz;` in the location(s) you want gated — usually
# the site root. It is written here as a server-level default.
auth_request /jit-authz;

# Render the Authorizer's interstitial / stealth response instead of NGINX's
# own error page, so the extension sees the X-JIT-Access marker.
auth_request_set $jit_status $upstream_status;
error_page 401 403 = @jit_denied;
error_page 404      = @jit_denied;

location @jit_denied {
    internal;
    proxy_pass              http://127.0.0.1:8998/authz;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        X-Forwarded-For   $remote_addr;
    proxy_set_header        X-Forwarded-Host  $host;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        X-Forwarded-Uri   $request_uri;
    proxy_set_header        Cookie            $http_cookie;
}

# ---- 4. pass the grant's Set-Cookie back to the browser -------------------
# Only needed for `binding: ip+cookie`; harmless otherwise.
auth_request_set $jit_set_cookie $upstream_http_set_cookie;
add_header Set-Cookie $jit_set_cookie always;
