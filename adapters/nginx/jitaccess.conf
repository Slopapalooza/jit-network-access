# JIT Network Access for plain NGINX, via the standalone Authorizer.
#
# Include this inside the server { } block you want to gate:
#
#   include /etc/nginx/snippets/jitaccess.conf;
#
# Assumes the Authorizer listens on 127.0.0.1:8998.
#
# NOTE ON STRUCTURE: `auth_request` and its `error_page` handlers are scoped to
# `location /`, NOT declared at server level. That is deliberate and is the shape
# the lab in test/harness/adapters actually exercises. A named location
# (@jit_denied) inherits directives from the SERVER, not from `location /`, so a
# server-level `auth_request` + `error_page 403 = @jit_denied` makes @jit_denied
# re-enter the access phase and be caught by its own error_page — an internal
# redirect cycle, which nginx answers with 500. The deny path is exactly the path
# a gate must get right, so keep these inside the location.
#
# ONE SERVER BLOCK PER GATED HOST, with an explicit server_name. The service the
# Authorizer evaluates is $host, the client's Host header. In a block with an
# explicit name nginx only routes matching hosts here, so that is safe. In a
# default_server or catch-all block it is not: a client sends `Host:` of some
# OTHER configured service it holds a grant for, /authz evaluates that service,
# answers 204, and this block's backend is served. Do not include this file in
# a catch-all block.
# ---- 1. the protocol endpoints -------------------------------------------
# challenge / respond / enroll are served BY the Authorizer, on the protected
# origin's own hostname, and must stay reachable while the service is dark.
location @jit_404 { internal; return 404; }

# The Authorizer answers an unknown path under the prefix with Go's
# "404 page not found" (text/plain). On a stealth service that is a tell: every
# other missing path on the host gets NGINX's HTML 404, so one request to
# <prefix>/anything says a JIT gate is mounted here. The Authorizer cannot know
# what its proxy's 404 looks like, so intercept it and serve ours.
#
# Only 404 is intercepted. The protocol endpoints answer 204/200/403 and are
# untouched -- verified on the lab: challenge still returns 204.
location /.well-known/jit-access/ {
    proxy_intercept_errors on;
    error_page 404 = @jit_404;
    proxy_pass         http://127.0.0.1:8998;
    proxy_set_header   Host              $host;
    # assign (never append) so a client-supplied value cannot survive
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   Cookie            $http_cookie;   # ip+cookie binding
    proxy_pass_request_body on;
}

# ---- 2. the gate ----------------------------------------------------------
location = /jit-authz {
    internal;
    proxy_pass              http://127.0.0.1:8998/authz;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";

    proxy_set_header        X-Forwarded-For    $remote_addr;
    proxy_set_header        X-Forwarded-Host   $host;
    proxy_set_header        X-Forwarded-Proto  $scheme;
    proxy_set_header        X-Forwarded-Uri    $request_uri;
    proxy_set_header        X-Forwarded-Method $request_method;
    # Blank the OTHER forwarding conventions. The Authorizer refuses a request
    # where two conventions disagree, so a client appending X-Original-URL would
    # otherwise turn its own request into a denial (and, before that rule, could
    # steer which service was evaluated). Assigning "" removes the header.
    proxy_set_header        X-Original-URL     "";
    proxy_set_header        X-Original-Host    "";
    proxy_set_header        X-Original-Uri     "";
    proxy_set_header        Cookie             $http_cookie;
}

# ---- 3. apply it to the site ---------------------------------------------
# Everything else is gated. Adjust the proxy_pass / root to your backend.
location / {
    auth_request /jit-authz;

    # No `add_header` here, on purpose. /authz never sets a cookie: the grant
    # cookie for `binding: ip+cookie` is set by the knock (POST <prefix>/respond),
    # which reaches the browser through the protocol location above. An
    # `add_header Set-Cookie $jit_cookie` that used to live here did nothing
    # useful and, because ANY add_header in a location disables inheritance of
    # every server-level add_header, silently dropped HSTS, CSP and the rest
    # for the whole gated site.

    # The marker is how this config tells the two failure modes apart: /authz
    # sets it for interstitial and withholds it for stealth.
    auth_request_set $jit_marker $upstream_http_x_jit_access;

    # Render the Authorizer's own interstitial response instead of NGINX's error
    # page, so the extension sees the X-JIT-Access marker.
    #
    # auth_request maps the subrequest result as: 2xx -> allow, 401/403 -> deny
    # with that status, ANYTHING ELSE -> 500. /authz therefore always denies with
    # 403, in either failure mode; it cannot answer 404, because that reached the
    # client as a 500 on any proxy that could not add the mapping this file used
    # to carry (ingress-nginx, notably, where every gated request to a stealth
    # service was a 500). The client-facing SHAPE is chosen below instead, where
    # the status is actually client-facing.
    #
    # 500 is deliberately no longer mapped: with /authz denying properly it only
    # ever means the Authorizer is unreachable, and that should fail closed and
    # visibly rather than be dressed up as a denial.
    error_page 401 403 = @jit_denied;

    proxy_pass http://127.0.0.1:3000;   # <-- your backend
    proxy_set_header Host $host;
}

location @jit_denied {
    internal;

    # Stealth must be indistinguishable from an unrouted path, and that decision
    # belongs here: /authz answers 403 in both modes because auth_request accepts
    # nothing else as a denial. No marker means stealth, so give the client the
    # same generic 404 nginx serves for a path that does not exist.
    if ($jit_marker = "") {
        return 404;
    }
    # nginx forbids a URI part on proxy_pass inside a NAMED location, so the
    # path is set with `rewrite ... break` instead of `.../authz`.
    rewrite ^ /authz break;
    proxy_pass              http://127.0.0.1:8998;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length    "";
    proxy_set_header        X-Forwarded-For   $remote_addr;
    proxy_set_header        X-Forwarded-Host  $host;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        X-Forwarded-Uri   $request_uri;
    # Same blanking as the gate location: without it a client-supplied
    # X-Original-URL reaches /authz here too, conflicts with the assigned
    # X-Forwarded-*, and the resulting deny falls back to the INTERSTITIAL —
    # announcing a gate the operator configured as stealth.
    proxy_set_header        X-Original-URL    "";
    proxy_set_header        X-Original-Host   "";
    proxy_set_header        X-Original-Uri    "";
    proxy_set_header        Cookie            $http_cookie;
}
