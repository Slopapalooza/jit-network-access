# Gating app.example.com behind JIT Network Access.
#
# TWO Ingresses are required:
#   1. the knock endpoints -> Authorizer, with NO auth annotation (a dark
#      service must still be knockable, or nobody could ever get in)
#   2. the app itself -> your Service, gated by auth-url
#
# ingress-nginx matches the more specific path first, so ordering is automatic.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-jit-protocol
  namespace: jit-system          # same namespace as the Authorizer Service
  annotations:
    # deliberately NO auth-url here
    nginx.ingress.kubernetes.io/proxy-body-size: 8k
spec:
  ingressClassName: nginx
  rules:
    # Prefix over the whole tree, deliberately, and it must STAY a prefix.
    #
    # Narrowing this to Exact rules for the four endpoints looks like an
    # improvement — less unauthenticated surface — and it is a live gate bypass.
    # The Authorizer's /authz carve-out lets ANY path under the prefix through
    # without a grant, because it assumes the proxy routes those paths to the
    # Authorizer rather than to your app. Exact rules break that agreement: a
    # request for /.well-known/jit-access/anything stops matching this Ingress,
    # falls through to the gated rule, is waved through by the carve-out, and
    # reaches the upstream unauthenticated. The lab caught exactly that.
    #
    # If this is ever narrowed, the Authorizer's carve-out has to be narrowed in
    # the same change, not after it.
    - host: app.example.com
      http:
        paths:
          - path: /.well-known/jit-access/
            pathType: Prefix
            backend:
              service:
                name: jit-authorizer
                port:
                  number: 8998
  tls:
    - hosts: [app.example.com]
      secretName: app-example-com-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: default
  annotations:
    # THE GATE: every request is authorized by the Authorizer first.
    nginx.ingress.kubernetes.io/auth-url: "http://jit-authorizer.jit-system.svc.cluster.local:8998/authz"
    # X-JIT-Kid is passed to the backend for logging. Set-Cookie is listed for
    # completeness only: /authz never sets one. The grant cookie is set by the
    # knock (POST <prefix>/respond), which goes to the Authorizer through the
    # UNGATED protocol Ingress above and reaches the browser directly — it is not
    # an auth subrequest, so auth-response-headers has nothing to do with it.
    nginx.ingress.kubernetes.io/auth-response-headers: "X-JIT-Kid"
    # ingress-nginx forwards the CLIENT's own headers on the auth subrequest, and
    # the controller pod is inside trusted_proxies. The real origin travels in
    # X-Original-URL, which the controller always sets; blanking the other
    # conventions means a client cannot describe the request a second, different
    # way. The Authorizer denies when two conventions disagree, so omitting this
    # snippet is no longer a bypass — a forged header makes the client's OWN
    # request fail instead. Keep it anyway: it turns a confusing denial into a
    # clean one, and defence in depth here is free.
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Original-Host "";
      proxy_set_header X-Forwarded-Uri "";
      proxy_set_header X-Original-Uri "";
spec:
  ingressClassName: nginx
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
  tls:
    - hosts: [app.example.com]
      secretName: app-example-com-tls
---
# See README.md — without client-IP preservation every external client looks
# like a node IP and they will SHARE grants. Set this on the ingress-nginx
# Service (usually via the controller's Helm values, shown here for reference):
#
# apiVersion: v1
# kind: Service
# metadata:
#   name: ingress-nginx-controller
#   namespace: ingress-nginx
# spec:
#   type: LoadBalancer
#   externalTrafficPolicy: Local     # <-- preserves the real client IP
