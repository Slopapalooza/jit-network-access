# JIT Network Access — Authorizer for ingress-nginx.
#
# ClusterIP only, on purpose: /authz and /admin/* must never be routable from
# outside the cluster. Do NOT add an Ingress for this Service.
---
apiVersion: v1
kind: Namespace
metadata:
  name: jit-system
---
apiVersion: v1
kind: Secret
metadata:
  name: jit-authorizer-config
  namespace: jit-system
type: Opaque
stringData:
  # The whole Authorizer config. Device secrets live here, so it is a Secret
  # rather than a ConfigMap — restrict it with RBAC and consider a sealed/
  # external secret in production.
  #
  # NOTE: the Authorizer parses this with DisallowUnknownFields — an unrecognized
  # key is a startup error, so keep explanatory notes here in YAML, never inside
  # the JSON below.
  #
  # admin_token is deliberately ABSENT. The admin API mints grants that skip the
  # registry re-check, so a shipped placeholder value is a cluster-wide backdoor
  # for every operator who never changed it. With no admin_token configured the
  # /admin/* surface refuses every request. To enable it: generate a value
  # (openssl rand -base64 32), add "admin_token": "<value>" below, and keep the
  # NetworkPolicy at the end of this file so only the ingress controller can
  # reach the port at all.
  #
  # trusted_proxies MUST be the ingress controller's POD CIDR — not all of
  # RFC1918. Two separate reasons:
  #   1. /authz and /admin refuse peers outside this list. Every pod in the
  #      cluster sits inside 10/8 by default, so listing 10/8 makes that check a
  #      no-op and any workload in the cluster can drive the gate.
  #   2. Resolving the client IP SKIPS every candidate inside this list. With
  #      10/8 trusted, on-prem clients on 10.x are all skipped, nothing
  #      identifies a client, and every request is DENIED. (It used to fall
  #      back to the controller's own address and silently share one grant.)
  # Find the real CIDR with: kubectl -n ingress-nginx get pods -o wide
  #
  # The forwarded address is only as good as the controller's own $remote_addr.
  # If the controller ConfigMap sets use-forwarded-headers: "true" (an L7 cloud
  # LB in front), proxy-real-ip-cidr MUST be that LB's exact source range: its
  # default is 0.0.0.0/0, which makes nginx take the client's own
  # X-Forwarded-For as the peer address, and a forged header then inherits
  # another client's grant. See the README, "If the load balancer is L7".
  config.json: |
    {
      "listen": "0.0.0.0:8998",

      "trusted_proxies": ["10.42.0.0/16"],
      "real_ip_header": "X-Forwarded-For",

      "grant_ttl": 3600,
      "nonce_ttl": 60,
      "enroll_ttl": 86400,
      "ipv6_prefix": 128,
      "rate_limit_per_min": 10,

      "services": {
        "app.example.com": {
          "tokens": ["kid_REPLACE"],
          "failure_mode": "interstitial",
          "binding": "ip"
        }
      },

      "tokens": [
        {
          "kid": "kid_REPLACE",
          "secret": "REPLACE-base64url-of-32-random-bytes",
          "label": "ops laptop"
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jit-authorizer
  namespace: jit-system
  labels: { app: jit-authorizer }
spec:
  # Grants are in-process. More than one replica means a client knocking on pod
  # A is not admitted by pod B — keep this at 1 until the Hardened shared
  # backend lands, or pin sessions to a pod.
  replicas: 1
  selector:
    matchLabels: { app: jit-authorizer }
  template:
    metadata:
      labels: { app: jit-authorizer }
    spec:
      # The Authorizer never talks to the API server; without this every pod
      # gets a projected service-account token it has no use for, and a
      # compromise of the process would hand it over.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authorizer
          # Published by the release workflow for linux/amd64 and linux/arm64.
          # Pin the release you verified; :latest also exists.
          image: ghcr.io/slopapalooza/jit-network-access/authorizer:1.0.0
          args: ["-config", "/etc/jitaccess/config.json"]
          ports:
            - name: http
              containerPort: 8998
          volumeMounts:
            - name: config
              mountPath: /etc/jitaccess
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          secret:
            secretName: jit-authorizer-config
---
apiVersion: v1
kind: Service
metadata:
  name: jit-authorizer
  namespace: jit-system
spec:
  type: ClusterIP
  selector: { app: jit-authorizer }
  ports:
    - name: http
      port: 8998
      targetPort: http
---
# A ClusterIP is reachable from EVERY pod in the cluster, so "not routable from
# outside" is not by itself a control: any workload could otherwise call /authz
# with headers of its choosing, or POST /admin/grant once an admin_token exists.
# This restricts :8998 to the ingress controller, which is the only client that
# has any business talking to it.
#
# Adjust the namespace selector to match your controller's namespace label. On
# Kubernetes 1.22+ every namespace carries kubernetes.io/metadata.name
# automatically; older clusters need the label added by hand.
#
# A default-deny ingress rule for the namespace is implied: once ANY
# NetworkPolicy selects a pod, only what is explicitly allowed reaches it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jit-authorizer
  namespace: jit-system
spec:
  podSelector:
    matchLabels: { app: jit-authorizer }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8998
