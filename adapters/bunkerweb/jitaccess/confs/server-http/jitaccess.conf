# JIT Network Access — per-server config.
#
# $is_jit_allowed mirrors the whitelist plugin's $is_whitelisted pattern: the
# access-phase Lua sets it to "yes" once a grant is confirmed, so ModSecurity/CRS
# and downstream config can see the decision early. It defaults to "no".
set $is_jit_allowed 'no';

# Fail-closed note (SECURITY-REVIEW C1 / DESIGN §11 R1). What actually holds the
# line, and what does not:
#
#   * access() in jitaccess.lua wraps itself in pcall and denies on ANY internal
#     error, instead of letting BunkerWeb's chain fall through to "allow".
#   * The vendored core is loaded with pcall at module scope, so a missing or
#     corrupt jitaccess/core/*.lua (it is git-ignored and produced by
#     build-vendor.sh) leaves the plugin LOADABLE and denying, rather than
#     failing to load — BunkerWeb logs a plugin load error and continues the
#     chain, which would otherwise serve a service the operator believes dark.
#
# There is deliberately NO conf-layer default-deny here. An earlier comment
# promised one; it cannot work as an nginx `if`, because $is_jit_allowed is set
# during the ACCESS phase while server/location `if` is evaluated in the
# preceding REWRITE phase — the test would always see 'no' and 403 every request,
# including granted ones. Residual risk: a failure that stops jitaccess.lua
# ITSELF from loading (syntax error, missing middleclass/bunkerweb.plugin) still
# removes the gate. Verify the plugin is loaded after any upgrade — see
# "confirm it loaded" in adapters/bunkerweb/README.md.
