# JIT Network Access — http-context config (injected once per BunkerWeb instance).
#
# Simple mode keeps ALL state in these process-local shared dicts — no Redis.
#
# jit_grants holds ONLY grants. jit_nonces holds the short-lived, single-use
# bookkeeping: spent-nonce claims (jit:nonce:), enrollment codes (jit:ec:) and
# their claim markers (jit:ecx:). Rate-limit counters live in their own dict
# (jit_rl) so unauthenticated request volume cannot evict either. A nonce flood
# can never LRU-evict a live grant or a BunkerWeb ban (SECURITY-REVIEW H5).
#
# Within jit_nonces the entries do share an eviction pool, so size it with
# headroom: if it fills, LRU eviction of a jit:nonce: key inside its 60 s TTL
# would let that nonce be replayed, and eviction of a jit:ec: key would silently
# void an enrollment link. 16m is far more than a self-host needs (each entry is
# tens of bytes, and the spent set is bounded by SUCCESSFUL knocks, not by
# challenge volume), but raise it before raising JIT_ACCESS_RATELIMIT a lot.
#
# Sizes are generous for a self-host; each grant/nonce entry is small.
lua_shared_dict jit_grants 16m;
lua_shared_dict jit_nonces 16m;
# Rate-limit counters get their own dict. SPEC §5 requires jit_nonces to be
# DEDICATED to spent-nonce claims; when the counters shared it, an
# unauthenticated attacker could mint one entry per source address and LRU-evict
# spent-nonce markers (re-enabling replay of a nonce inside its TTL) or
# enrollment codes. Small: one short-lived counter per active source address.
lua_shared_dict jit_rl 4m;

# HARDENED (M6): when a shared Redis backend is configured these dicts become a
# local cache in front of it; declarations stay the same.
