testData:
  allow:
    - kid_demo
  tokens:
    - kid: kid_demo
      secret: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
      label: demo device
  binding: ip
  failureMode: interstitial
  grantTtl: 3600
