# Traefik + Authorizer + a protected service, labels-based.
# The Authorizer has NO published ports and NO router of its own: it is reachable
# only from Traefik on the internal network.

services:
  traefik:
    image: traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.websecure.address=:443
    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge, internal]

  authorizer:
    image: golang:1.24
    working_dir: /src/authorizer
    command: ["go", "run", "."]
    volumes:
      - ../..:/src:ro
      - ./authorizer-config.json:/src/authorizer/config.json:ro
    networks: [internal]
    # deliberately: no ports, no traefik labels

  app:
    image: traefik/whoami
    networks: [internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=internal

      # 1. protocol endpoints -> Authorizer, higher priority, NO middleware
      - traefik.http.routers.app-jit.rule=Host(`app.example.com`) && PathPrefix(`/.well-known/jit-access/`)
      - traefik.http.routers.app-jit.priority=1000
      - traefik.http.routers.app-jit.entrypoints=websecure
      - traefik.http.routers.app-jit.tls=true
      - traefik.http.routers.app-jit.service=jit-authorizer
      - traefik.http.services.jit-authorizer.loadbalancer.server.port=8998

      # 2. the gate
      - traefik.http.middlewares.jit-access.forwardauth.address=http://authorizer:8998/authz
      - traefik.http.middlewares.jit-access.forwardauth.authResponseHeaders=Set-Cookie,X-JIT-Kid

      # 3. the protected site
      - traefik.http.routers.app.rule=Host(`app.example.com`)
      - traefik.http.routers.app.priority=100
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls=true
      - traefik.http.routers.app.middlewares=jit-access
      - traefik.http.services.app.loadbalancer.server.port=80

networks:
  edge:
  internal:
    internal: true
