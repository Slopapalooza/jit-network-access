# Traefik + Authorizer + a protected service, labels-based.
#
# The Authorizer publishes no ports. Its ONLY router is the protocol prefix
# (/.well-known/jit-access/), so /authz and /admin/* are never routable from
# outside: they are reachable solely from Traefik on the internal network.
#
# Before `docker compose up`, edit authorizer-config.json next to this file:
# replace the token secret (the Authorizer refuses to start on the placeholder)
# and the hostname.

services:
  traefik:
    image: traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.websecure.address=:443
    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge, internal]

  authorizer:
    # The internal network has no route out, and the Authorizer needs none: its
    # only dependency is core/go, mounted with the repo below. GOTOOLCHAIN=local
    # keeps `go run` from trying to fetch the toolchain named in go.mod.
    image: golang:1.26
    environment:
      - GOTOOLCHAIN=local
    working_dir: /src/authorizer
    command: ["go", "run", "."]
    volumes:
      - ../..:/src:ro
      - ./authorizer-config.json:/src/authorizer/config.json:ro
    networks: [internal]
    # No published ports. The protocol router lives HERE, on the container it
    # routes to: Traefik's docker provider builds a service's address from the
    # container that carries the label, so declaring jit-authorizer on the app
    # container pointed it at the app's own address, where nothing listens on
    # 8998, and no device could ever knock. Because this container declares a
    # router of its own, Traefik also does not invent a default Host(`authorizer`)
    # router that would expose everything else.
    labels:
      - traefik.enable=true
      - traefik.docker.network=internal

      # 1. protocol endpoints -> Authorizer, higher priority, NO middleware
      - traefik.http.routers.app-jit.rule=Host(`app.example.com`) && PathPrefix(`/.well-known/jit-access/`)
      - traefik.http.routers.app-jit.priority=1000
      - traefik.http.routers.app-jit.entrypoints=websecure
      - traefik.http.routers.app-jit.tls=true
      - traefik.http.routers.app-jit.service=jit-authorizer
      - traefik.http.services.jit-authorizer.loadbalancer.server.port=8998

  app:
    image: traefik/whoami
    networks: [internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=internal

      # 2. the gate
      - traefik.http.middlewares.jit-access.forwardauth.address=http://authorizer:8998/authz
      - traefik.http.middlewares.jit-access.forwardauth.authResponseHeaders=Set-Cookie,X-JIT-Kid

      # 3. the protected site
      - traefik.http.routers.app.rule=Host(`app.example.com`)
      - traefik.http.routers.app.priority=100
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls=true
      - traefik.http.routers.app.middlewares=jit-access
      - traefik.http.services.app.loadbalancer.server.port=80

networks:
  edge:
  internal:
    internal: true
    # Pinned so authorizer-config.json's trusted_proxies can name it exactly.
    ipam:
      config:
        - subnet: 172.28.0.0/24
