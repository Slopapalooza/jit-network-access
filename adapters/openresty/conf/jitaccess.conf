# JIT Network Access for OpenResty — http-block configuration.
#
#   include /etc/openresty/conf.d/jitaccess.conf;   (inside http { })
#
# Then add `access_by_lua_block { require("jitaccess.openresty").access() }` to
# each server you want gated (see the server example at the bottom).

# The portable core plus this adapter. Adjust the paths to where you installed
# core/lua and adapters/openresty/lib.
lua_package_path "/usr/local/share/jitaccess/?.lua;/usr/local/share/jitaccess/lib/?.lua;;";

# Simple profile keeps ALL state here — no Redis, no database.
# jit_nonces is DEDICATED to spent-nonce claims and rate-limit counters, kept
# separate from jit_grants so a nonce flood can never evict live grants.
lua_shared_dict jit_grants 16m;
lua_shared_dict jit_nonces 16m;
# Rate-limit counters, kept OUT of the nonce dict so a flood of counters
# cannot LRU-evict spent-nonce markers or enrollment codes (SPEC §5).
lua_shared_dict jit_rl 4m;

# Needed so the gate can reach nothing external — but OpenResty wants a resolver
# configured if your upstreams are DNS names.
# resolver 127.0.0.11 ipv6=off;

init_by_lua_block {
    require("jitaccess.openresty").init({
        uri_prefix  = "/.well-known/jit-access",
        grant_ttl   = 3600,     -- how long a knock admits the client
        nonce_ttl   = 60,       -- challenge freshness window
        enroll_ttl  = 86400,    -- enrollment link lifetime
        ipv6_prefix = 128,      -- 64 would admit a whole /64
        rate_limit  = 10,       -- knock attempts per minute per IP

        -- Leave false unless OpenResty is genuinely behind a trusted proxy with
        -- set_real_ip_from narrowed to the exact front-door hops. False keys
        -- grants on the un-forgeable TCP peer.
        trust_forwarded = false,

        -- One entry per enrolled device. Generate a secret with:
        --   openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
        tokens = {
            { kid = "kid_REPLACE", secret = "REPLACE-base64url-secret", label = "ops laptop" },
        },

        -- Which kids may open which site. Use { "*" } for any registered token.
        services = {
            ["app.example.com"] = {
                tokens       = { "kid_REPLACE" },
                binding      = "ip",             -- or "ip+cookie" (device-bound)
                failure_mode = "interstitial",   -- or "stealth" (generic 404)
            },
        },
    })
}

# ---------------------------------------------------------------------------
# Per-server usage:
#
# server {
#     listen 443 ssl;
#     server_name app.example.com;
#
#     ssl_certificate     /etc/ssl/app.crt;
#     ssl_certificate_key /etc/ssl/app.key;
#
#     access_by_lua_block { require("jitaccess.openresty").access() }
#
#     location / {
#         proxy_pass http://127.0.0.1:3000;
#         proxy_set_header Host $host;
#     }
# }
#
# The knock endpoints are served by the access phase itself, so they need no
# location block and stay reachable while the site is dark.
