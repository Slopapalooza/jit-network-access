#
# A one-off dependency bump is a snapshot; this is what keeps it true. The
# advisories that mattered here (grpc, x/text, otel) all arrived in transitive
# dependencies of Caddy, with no change to this repository.
#
# CI runs govulncheck on a weekly schedule as the backstop: Dependabot proposes,
# govulncheck notices when nothing has been proposed and something is wrong.

version: 2
updates:
  # Four separate Go modules, each resolved independently.
  - package-ecosystem: gomod
    directory: /core/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /authorizer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /adapters/caddy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Caddy drags in a large transitive tree; one PR per patch bump would be
      # unreadable and would not get reviewed, which defeats the point.
      caddy-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # cel-go is indirect and its version is Caddy's decision, not ours.
      #
      # This one is a KNOWN-ADVISORY DEFERRAL, not a clean skip. GHSA-gcjh-h69q-9w9g
      # (medium, "JSON Private Fields Exposed via NativeTypes and ParseStructTag")
      # covers >= 0.22.0, <= 0.28.1, and the first patched version is exactly the
      # 0.29.0 that cannot be taken: it renames interpreter.Interpretable to
      # InterpretableV2, and caddy v2.11.4 — the latest release — is written
      # against the old API, so the bump fails to compile inside Caddy's own
      # celmatcher.go (PR #6). There is no version of Caddy today that accepts the
      # fix, so the choice is a broken build or the advisory.
      #
      # What makes the wait tolerable: govulncheck puts cel-go in "modules you
      # require, but your code doesn't appear to call" — the vulnerable
      # NativeTypes/ParseStructTag path is not reachable from this adapter, which
      # registers no CEL types. That is reachability, NOT absence of the advisory.
      #
      # REMOVE THIS as soon as Caddy ships a release on the v0.29 API, and re-run
      # govulncheck. Leaving it in place silently stops tracking a real advisory.
      - dependency-name: "github.com/google/cel-go"

  # No external dependencies by design — Traefik interprets this module under
  # Yaegi and cannot fetch anything at plugin load. Listed so that if a
  # dependency ever appears, it is watched rather than silently unwatched.
  - package-ecosystem: gomod
    directory: /adapters/traefik/plugin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
