#
# A one-off dependency bump is a snapshot; this is what keeps it true. The
# advisories that mattered here (grpc, x/text, otel) all arrived in transitive
# dependencies of Caddy, with no change to this repository.
#
# CI runs govulncheck on a weekly schedule as the backstop: Dependabot proposes,
# govulncheck notices when nothing has been proposed and something is wrong.

version: 2
updates:
  # Four separate Go modules, each resolved independently.
  - package-ecosystem: gomod
    directory: /core/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /authorizer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /adapters/caddy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Caddy drags in a large transitive tree; one PR per patch bump would be
      # unreadable and would not get reviewed, which defeats the point.
      caddy-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # cel-go is indirect and its version is decided by Caddy, not here. v0.29.0
      # renamed interpreter.Interpretable to InterpretableV2 and caddy v2.11.4 is
      # written against the old one, so the bump fails to compile inside Caddy's
      # own celmatcher.go (PR #6). It has to move as part of a Caddy upgrade.
      #
      # REMOVE THIS once Caddy is on a release that uses the v0.29 API, or the
      # dependency silently stops being tracked. govulncheck reports 0 for this
      # module on the current pin, so nothing is being deferred for security.
      - dependency-name: "github.com/google/cel-go"

  # No external dependencies by design — Traefik interprets this module under
  # Yaegi and cannot fetch anything at plugin load. Listed so that if a
  # dependency ever appears, it is watched rather than silently unwatched.
  - package-ecosystem: gomod
    directory: /adapters/traefik/plugin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
