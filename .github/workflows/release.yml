#
# Cut a release on a v* tag.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Everything except the container image is assembled by scripts/build-release.sh,
# which runs the same on a laptop as it does here — so what gets published is
# reproducible without this workflow. The image is separate only because it needs
# a registry login.
#
# The Traefik adapter has no artifact by design: Traefik fetches the plugin from
# source at the git tag and interprets it with Yaegi, so the tag IS the release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (dry run — publishes nothing)"
        required: true

permissions:
  contents: write # create the release
  packages: write # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same pattern as ci.yml: setup-go's go-version-file reads the `go`
      # directive, not `toolchain`, so the pin is read out of the go.mod here.
      - name: resolve pinned toolchain
        id: toolchain
        run: |
          v=$(sed -n 's/^toolchain go//p' authorizer/go.mod | tr -d '[:space:]')
          if [ -z "$v" ]; then
            echo "::error::authorizer/go.mod has no toolchain directive"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache-dependency-path: "**/go.sum"

      - name: resolve version
        id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "bare=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: build artifacts
        run: ./scripts/build-release.sh "${{ steps.v.outputs.tag }}"

      # A release whose binary reports a different version than the tag is worse
      # than no release: every later bug report cites a version that never
      # existed. amd64 runs natively here, so check it.
      - name: binary reports the tagged version
        run: |
          got=$(./dist/jitaccess-authorizer-${{ steps.v.outputs.tag }}-linux-amd64 -version)
          want="jitaccess-authorizer ${{ steps.v.outputs.bare }}"
          echo "  reported: $got"
          [ "$got" = "$want" ] || { echo "::error::version mismatch: got '$got', want '$want'"; exit 1; }

      - name: checksums verify against the artifacts
        run: cd dist && sha256sum -c SHA256SUMS

      # --- container image, for the Kubernetes adapter ------------------------
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build (and on a tag, push) the Authorizer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: authorizer/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.bare }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}/authorizer:${{ steps.v.outputs.bare }}
            ghcr.io/${{ github.repository }}/authorizer:latest

      # --- publish ------------------------------------------------------------
      - name: create the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --title "${{ steps.v.outputs.tag }}" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            --verify-tag \
            dist/*
